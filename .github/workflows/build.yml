name: Build PaisaPilot Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Assemble Full Flutter & Android Project
        run: |
          # 1. Create a clean Flutter project structure in a temp directory
          flutter create --org com.gsktechnologies --project-name paisapilot_ai temp_app
          
          # 2. Copy the fresh android engine files into root
          cp -r temp_app/android ./android
          
          # 3. If pubspec.yaml was placed in .github/workflows, move it to root
          if [ -f .github/workflows/pubspec.yaml ] && [ ! -f ./pubspec.yaml ]; then
            mv .github/workflows/pubspec.yaml ./pubspec.yaml
          fi
          
          # If still missing in root, use the template pubspec
          if [ ! -f ./pubspec.yaml ]; then
            cp temp_app/pubspec.yaml ./pubspec.yaml
          fi

          # Clean up temp folder
          rm -rf temp_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (.aab for Google Play)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Android APK (for direct phone install)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-Test-APK
          path: build/app/outputs/flutter-apk/app-release.apk

